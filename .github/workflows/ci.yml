name: CI

on:
  push:
    branches:
      - aiomusiccast-co
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # Make sure commit messages follow the conventional commits convention,
  # which python-semantic-release uses to pick the next version:
  # https://www.conventionalcommits.org
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6.2.1

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --locked
      - name: Test with pytest
        run: uv run pytest

  release:
    # Only pushes to the release branch can release; PRs stop after the checks above.
    if: github.event_name == 'push' && github.ref_name == 'aiomusiccast-co'
    needs:
      - lint
      - commitlint
      - test

    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      id-token: write
      attestations: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # Release exactly the commit that passed the checks, even if the branch moved since.
      - name: Force release branch to the workflow sha
        run: git reset --hard ${{ github.sha }}

      - name: Release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        if: steps.release.outputs.released == 'true'
        with:
          subject-path: "dist/*"

      # Trusted publishing: PyPI accepts this workflow's OIDC identity, no token needed.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'

      - name: Publish package distributions to GitHub Releases
        uses: python-semantic-release/publish-action@v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
