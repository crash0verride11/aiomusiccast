[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aiomusiccast-co"
version = "0.15.0"
description = "Asyncio library for Yamaha MusicCast devices; maintained fork of aiomusiccast for the Home Assistant integration."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Tom Schneider", email = "mail@vigonotion.com" }]
maintainers = [{ name = "crash0verride11" }]
requires-python = ">=3.11"
keywords = ["yamaha", "musiccast", "asyncio", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/crash0verride11/aiomusiccast"
Repository = "https://github.com/crash0verride11/aiomusiccast"
"Bug Tracker" = "https://github.com/crash0verride11/aiomusiccast/issues"
Changelog = "https://github.com/crash0verride11/aiomusiccast/blob/aiomusiccast-co/CHANGELOG.md"

[dependency-groups]
dev = [
    "ipython>=8.24.0",
    "mypy>=1.8.0",
    "pre-commit>=3.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.0",
]

[tool.semantic_release]
commit_parser = "conventional"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["aiomusiccast_co/__init__.py:__version__"]
# feat bumps minor and breaking changes stay in 0.x until 1.0 is chosen deliberately.
allow_zero_version = true
major_on_zero = false
# The PSR GitHub Action's container has no uv; keep uv.lock's project version in sync with the bump.
build_command = """
    python -m pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
ignore_merge_commits = true

[tool.semantic_release.branches.release]
match = "aiomusiccast-co"

[tool.semantic_release.branches.noop]
match = "(?!aiomusiccast-co$)"
prerelease = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
    "ARG",
    "B",
    "C4",
    "D",
    "DTZ",
    "ERA",
    "FA",
    "FIX",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T1",
    "UP",
    "YTT",
]
ignore = [
    "D1",
    "D201",
    "D202",
    "D203",
    "D204",
    "D211",
    "D213",
    "E501",
    "PLC0414",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.isort]
combine-as-imports = true
